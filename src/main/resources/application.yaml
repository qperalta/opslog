spring:
  application:
    name: opslog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # load lazy relations for a page of rows in batches instead of one query per row (N+1)
        default_batch_fetch_size: 50
  datasource:
    hikari:
      maximum-pool-size: 5
  ai:
    mcp:
      server:
        name: opslog
        version: 1.0.0
        protocol: streamable
        type: sync
        annotation-scanner:
          enabled: true

server:
  port: ${PORT:8080}

opslog:
  jwt:
    secret: dev-only-secret-change-me-0123456789abcdef
    ttl: 1h
  # demo account for the videos and the evaluator; OPSLOG_DEMO_ENABLED=true and OPSLOG_DEMO_PASSWORD turn it on
  demo:
    enabled: false
    reset: false
    email: demo@kaimanastrength.example
    display-name: Kai Demo

management:
  health:
    db:
      enabled: true
